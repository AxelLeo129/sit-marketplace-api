; Ajustes de PHP para producción (sobre php.ini-production).
expose_php = Off
memory_limit = 256M
; Las imágenes se validan a 2 MB en la API; un poco de margen para el resto del formulario.
upload_max_filesize = 4M
post_max_size = 8M

opcache.enable = 1
opcache.validate_timestamps = 0
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
